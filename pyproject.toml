[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metricmedic"
version = "1.0.0"
description = "RAG API, tracing & evals for SQL/dashboard/KPI/ETL troubleshooting"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
metricmedic-mcp = "metricmedic.mcp_server:main"

[tool.setuptools.packages.find]
include = ["metricmedic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in a default argument is the intended pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Hand-written golden questions and reference answers are long sentences.
"evals/build_golden.py" = ["E501"]
# Sets RAGAS_DO_NOT_TRACK before importing ragas, so later imports are not at the top.
"evals/ragas_eval.py" = ["E402"]
